name: Welcome on New Issue

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  welcome-issue:
    runs-on: ubuntu-latest
    # Skip bots
    if: ${{ !contains(github.event.issue.user.login, '[bot]') && github.event.issue.user.type != 'Bot' }}
    steps:
      - name: Post welcome comment on new issue
        uses: peter-evans/create-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Hey @${{ github.event.issue.user.login }}! 👋

            Thanks for opening this issue — we really appreciate you taking the time to contribute to **AIAtlas**! 🙌

            A few things to help us move forward quickly:

            - ⭐ **If you haven't already, please [star the repo](https://github.com/AditthyaSS/AIAtlas)!** It helps more people discover the project and keeps our community growing.
            - 📖 Take a moment to read the [Contributing Guide](https://github.com/AditthyaSS/AIAtlas/blob/main/CONTRIBUTING.md) — it covers everything you need to know.
            - 💬 If you're interested in working on this, drop a comment saying **"I'd like to work on this"** and I'll assign it to you!
            - 🔍 Please make sure you've searched for existing issues to avoid duplicates.

            Every issue matters — thank you for helping make AIAtlas better! 🚀

            — [@AditthyaSS](https://github.com/AditthyaSS)
