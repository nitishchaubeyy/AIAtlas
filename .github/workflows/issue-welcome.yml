name: Issue Welcome

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  issue-welcome:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.issue.user.login, '[bot]') && github.event.issue.user.type != 'Bot' }}
    steps:
      - name: Add triage label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['triage']
            }).catch(() => {
              // Label may not exist yet — ignore error
            });

      - name: Post welcome comment
        uses: peter-evans/create-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Hey @${{ github.event.issue.user.login }}! 👋

            Thanks for opening this issue — we really appreciate you taking the time to contribute to **AIAtlas**! 🙌

            **What happens next:**
            1. A maintainer will review and label this issue within 24–48 hours
            2. Once triaged, it will be open for community members to pick up
            3. Comment **"I'd like to work on this"** when you're ready to be assigned

            **While you wait:**
            - ⭐ [Star the repo](https://github.com/AditthyaSS/AIAtlas) to stay updated and help others discover the project
            - 📖 Read the [Contributing Guide](https://github.com/AditthyaSS/AIAtlas/blob/main/CONTRIBUTING.md)
            - 🔍 Make sure there are no duplicate issues already open

            Every issue matters — thank you for helping make AIAtlas better! 🚀

            — [@AditthyaSS](https://github.com/AditthyaSS)
